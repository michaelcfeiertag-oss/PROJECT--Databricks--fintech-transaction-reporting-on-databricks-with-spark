bundle:
  name: fintech-transaction-reporting-project

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://example-workspace.cloud.databricks.com

resources:
  jobs:
    fintech_reporting_job:
      name: fintech-reporting-job
      tasks:
        - task_key: ingest_raw
          notebook_task:
            notebook_path: ./notebooks/02_ingest_raw_from_volume.py
        - task_key: prepare_silver
          depends_on:
            - task_key: ingest_raw
          notebook_task:
            notebook_path: ./notebooks/03_prepare_silver_data.py
        - task_key: build_gold
          depends_on:
            - task_key: prepare_silver
          notebook_task:
            notebook_path: ./notebooks/04_build_gold_reports.py
        - task_key: run_quality_checks
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ./notebooks/05_data_quality_checks.py
